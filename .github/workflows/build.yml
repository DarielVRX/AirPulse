name: Build AirPulse

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        # El input "packages" de esta accion instala por defecto
        # 'tools platform-tools' (ver su propio action.yml). "tools" es el
        # paquete legacy (android-sdk-tools) que Google ya retiro del
        # repositorio, y la accion falla en ESTE MISMO STEP con
        # "Failed to find package 'tools'" antes de llegar a ningun step
        # posterior -- no alcanza con instalar los paquetes correctos
        # despues, hay que evitar que esta accion intente instalar "tools"
        # en absoluto. packages: '' le dice que no instale nada por
        # defecto; el step siguiente instala explicitamente solo lo que
        # hace falta.
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        # Paquetes que realmente hacen falta para compilar: platform-tools,
        # la platform del compileSdk declarado en app/build.gradle, y una
        # build-tools compatible.
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests (motor de deteccion)
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airpulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airpulse-unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
