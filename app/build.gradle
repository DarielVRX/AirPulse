// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

// Las versiones se declaran una sola vez, en pluginManagement.plugins{}
// dentro de settings.gradle (resuelto antes de este archivo). Aca solo se
// aplican (apply false = disponibles para los submodulos, no aplicados al
// proyecto raiz), sin repetir version para evitar que queden
// desincronizadas entre los dos archivos.
plugins {
    id 'com.android.application' apply false
    id 'org.jetbrains.kotlin.android' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
